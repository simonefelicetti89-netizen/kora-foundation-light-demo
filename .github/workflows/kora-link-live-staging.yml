name: KORA Link — live staging suite (manual)

# KORA-LINK-HARDENING-AUTOMATION-13C. Manual, opt-in confirmation of a
# representative subset of the C1-C10 behavioral suite against real staging
# infrastructure — never run automatically, never on a pull_request or push
# trigger. See docs/KORA_LINK_AUTOMATED_TESTING.md for scope, rationale, and
# why this is deliberately narrower than the local integration suite in
# ci.yml (which is CI-mandatory and exhaustive).
#
# Required repository/environment secrets (never committed to source):
#   KORA_LINK_STAGING_DB_URL          — Supavisor Session pooler connection
#                                       string, port 5432 (never Transaction
#                                       pooler / 6543). Never the service-role
#                                       API key used as a password.
#   KORA_LINK_STAGING_PROJECT_REF     — expected staging project ref, used by
#                                       the script itself to refuse to run
#                                       against any other project.
#
# This workflow does not create these secrets, does not print them, and does
# not run unless a human explicitly triggers it via workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm you intend to run live tests against staging'
        required: true
        default: 'NO'

jobs:
  live-staging-suite:
    name: Live staging behavioral suite (manual opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.inputs.confirm == 'YES'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run KORA Link live staging suite
        env:
          KORA_LINK_LIVE_TESTS_CONFIRM: 'YES'
          KORA_LINK_STAGING_DB_URL: ${{ secrets.KORA_LINK_STAGING_DB_URL }}
          KORA_LINK_STAGING_PROJECT_REF: ${{ secrets.KORA_LINK_STAGING_PROJECT_REF }}
        run: npm run test:kora-link:live-staging > kora-link-live-staging-report.json

      - name: Upload live staging suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kora-link-live-staging-report
          path: kora-link-live-staging-report.json
          retention-days: 30
