<!doctype html>
<html lang="it">
  <body style="margin:0;padding:32px 24px;background:#ffffff;color:#1d1c1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;">
    <p style="margin:0 0 24px;font-weight:700;letter-spacing:-0.01em;">KORA</p>
    <p style="margin:0 0 16px;">Abbiamo ricevuto una richiesta di reimpostare la password del tuo account KORA.</p>
    <p style="margin:0 0 24px;">
      <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery"
         style="display:inline-block;padding:12px 20px;background:#1d1c1a;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600;">Scegli una nuova password</a>
    </p>
    <p style="margin:0 0 8px;color:#69655e;font-size:13px;">Il link vale una sola volta e per un tempo limitato.</p>
    <p style="margin:0;color:#69655e;font-size:13px;">Se non hai fatto tu questa richiesta, ignora questa email: la password attuale resta valida.</p>
  </body>
</html>
